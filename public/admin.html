<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEU Library Admin Dashboard</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh2knqhUrqko48MBxKLLX3uhcWM4-_DoY",
  authDomain: "neu-library-visitor.firebaseapp.com",
  projectId: "neu-library-visitor",
  storageBucket: "neu-library-visitor.appspot.com",
  messagingSenderId: "320271193731",
  appId: "1:320271193731:web:f3f5cfe1d07c1887f8adb6",
  measurementId: "G-HH9H155CRF"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const visitsRef = collection(db, "visits");

async function loadStats(filterCollege = "", filterReason = "", filterEmployee = "") {
  const q = query(visitsRef, orderBy("timestamp", "desc"));
  const snapshot = await getDocs(q);

  const visits = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

  // Filters
  let filtered = visits.filter(v => {
    let matchesCollege = !filterCollege || filterCollege === "All" || v.college === filterCollege;
    let matchesReason = !filterReason || filterReason === "All" || v.purposeOfVisit === filterReason;
    let matchesEmployee = !filterEmployee || filterEmployee === "All" ||
      (filterEmployee === "Employee" && v.isEmployee) ||
      (filterEmployee === "Student" && !v.isEmployee);
    return matchesCollege && matchesReason && matchesEmployee;
  });

  // Update stats cards
  document.getElementById("totalVisits").textContent = visits.length;
  document.getElementById("filteredVisits").textContent = filtered.length;

  // Populate table
  const tbody = document.getElementById("visitList");
  tbody.innerHTML = "";
  if(filtered.length === 0) {
    tbody.innerHTML = "<tr><td colspan='5'>No visitors found.</td></tr>";
  } else {
    filtered.forEach(v => {
      const ts = v.timestamp ? new Date(v.timestamp.seconds*1000).toLocaleString() : "-";
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${v.email || "-"}</td>
                      <td>${v.college || "-"}</td>
                      <td>${v.purposeOfVisit || "-"}</td>
                      <td>${v.isEmployee ? "Employee" : "Student"}</td>
                      <td>${ts}</td>`;
      tbody.appendChild(tr);
    });
  }
}

// On filter change
function filterChanged() {
  const college = document.getElementById("filterCollege").value;
  const reason = document.getElementById("filterReason").value;
  const employee = document.getElementById("filterEmployee").value;
  loadStats(college, reason, employee);
}

window.onload = () => {
  loadStats();
  document.getElementById("filterCollege").addEventListener("change", filterChanged);
  document.getElementById("filterReason").addEventListener("change", filterChanged);
  document.getElementById("filterEmployee").addEventListener("change", filterChanged);
};
</script>

<style>
body {
  font-family: 'Roboto', sans-serif;
  background: url('cics.jpg') no-repeat center center fixed;
  background-size: cover;
  margin: 0;
  padding: 20px;
  color: white;
  min-height: 100vh;
}
.container {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  padding: 30px;
  max-width: 1100px;
  margin: auto;
}
h1 { margin-bottom: 20px; font-weight:700; }
.stats { display:flex; gap:20px; margin-bottom:20px; }
.card {
  background: rgba(255,255,255,0.2);
  border-radius:12px;
  padding:20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  color: black;
  flex:1;
  text-align:center;
}
.card h2 { margin-top:0; color:#007bff; }
.filters { margin-bottom:15px; display:flex; flex-wrap:wrap; gap:10px; }
.filters select { padding:10px; font-size:16px; border-radius:8px; border:none; }
table {
  width:100%;
  border-collapse: collapse;
  background: rgba(0,0,0,0.25);
  border-radius:8px;
  overflow:hidden;
  color:white;
}
thead tr { background: rgba(0,123,255,0.9); color:white; }
th, td { padding:12px 10px; text-align:left; color:white; }
tbody tr:nth-child(odd) { background: rgba(255,255,255,0.05); }
tbody tr:nth-child(even) { background: rgba(0,0,0,0.15); }
@media (max-width:768px) { .stats { flex-direction:column; } }
</style>
</head>

<body>
<div class="container">
  <h1>NEU Library Admin Dashboard</h1>

  <div class="stats">
    <div class="card">
      <h2>Total Visits</h2>
      <p id="totalVisits">Loading...</p>
    </div>
    <div class="card">
      <h2>Filtered Visits</h2>
      <p id="filteredVisits">Loading...</p>
    </div>
  </div>

  <div class="filters">
    <select id="filterCollege">
      <option value="All">All Colleges</option>
      <option value="College of Arts">College of Arts</option>
      <option value="College of Nursing">College of Nursing</option>
      <option value="College of Business">College of Business</option>
      <option value="College of Education">College of Education</option>
      <option value="College of Engineering">College of Engineering</option>
      <option value="Other">Other</option>
    </select>

    <select id="filterReason">
      <option value="All">All Reasons</option>
      <option value="Study">Study</option>
      <option value="Research">Research</option>
      <option value="Borrowing">Borrowing</option>
      <option value="Other">Other</option>
    </select>

    <select id="filterEmployee">
      <option value="All">All</option>
      <option value="Employee">Employee</option>
      <option value="Student">Student</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>College</th>
        <th>Purpose</th>
        <th>Role</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="visitList">
      <tr><td colspan="5">Loading visitors...</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
